[project]
name = "neurisai-core"
version = "0.1.0"
description = "Forensic Psychology & Behavioral Analysis AI Engine"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "NeurisAI", email = "dev@neurisai.me"}]

dependencies = [
    "torch>=2.2.0",
    "transformers>=4.38.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "strawberry-graphql>=0.219.0",
    "sqlalchemy>=2.0.25",
    "asyncpg>=0.29.0",
    "pgvector>=0.2.4",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.2.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
